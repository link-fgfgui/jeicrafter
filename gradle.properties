# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=com.jeicrafter
java_version=17

# Common
minecraft_version=1.20.1
mod_name=JEI Crafter
mod_author=Jared
mod_id=jeicrafter
license=CC0-1.0
credits=
description=The description of your mod. \nAccepts multilines.
minecraft_version_range=[1.20.1, 1.22)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# JEI
jei_version=15.21.0.148
jei_version_range=[15.21.0.148,)
# fabric 的版本谓词解析器不支持 [min,) 区间语法（会退化成字面量相等），
# fabric.mod.json 里必须用比较运算符写法。Forge 的 mods.toml 支持区间，保持原样。
jei_version_range_fabric=>=15.21.0.148

# Fabric
fabric_version=0.92.11+1.20.1
fabric_loader_version=0.16.10

# Forge
forge_version=47.2.30
forge_loader_version_range=[47,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
